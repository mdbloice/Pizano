  :root {
    /* Brand colours (Colours.txt) */
    --brand-red: #e31e27;
    --brand-green: #15a857;
    --brand-black: #1c1c1a;

    --bg: #faf7f2;
    --surface: #ffffff;
    --surface-2: #f2eee7;
    --text: #1c1c1a;
    --muted: #66625b;
    --border: #e3ddd3;
    --accent: var(--brand-red);
    --accent-text: #c4161f;
    --accent-soft: #fbe3e3;
    --green: var(--brand-green);
    --green-text: #0e7a3e;
    --green-soft: #e0f3e8;
    --amber: #a86a00;
    --amber-soft: #fbefd6;
    --shadow: 0 1px 2px rgba(28, 28, 26, .05), 0 4px 16px rgba(28, 28, 26, .06);
    --radius: 14px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211;
      --surface: #1c1c1a;
      --surface-2: #262624;
      --text: #f3f1ec;
      --muted: #a7a39b;
      --border: #34332f;
      --accent-text: #ff5c62;
      --accent-soft: #3a1517;
      --green-text: #3fd27f;
      --green-soft: #12301f;
      --amber: #e5b04f;
      --amber-soft: #3a2e17;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211;
    --surface: #1c1c1a;
    --surface-2: #262624;
    --text: #f3f1ec;
    --muted: #a7a39b;
    --border: #34332f;
    --accent-text: #ff5c62;
    --accent-soft: #3a1517;
    --green-text: #3fd27f;
    --green-soft: #12301f;
    --amber: #e5b04f;
    --amber-soft: #3a2e17;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--sans);
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }

  header.masthead .wrap { padding-top: 40px; padding-bottom: 24px; }
  header h1 {
    font: 400 clamp(56px, 10vw, 84px)/1 "Great Vibes", var(--serif);
    color: var(--brand-red);
    margin: 0 0 12px;
  }
  header .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
  header .brand .tricolore { margin-bottom: 0; }
  header p { margin: 0; color: var(--muted); max-width: 640px; }
  header .source {
    margin-top: 18px; max-width: 720px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--brand-green); border-radius: 10px;
    font-size: 14.5px;
  }
  header .source strong { display: block; font: 600 17px/1.3 var(--serif); margin-bottom: 4px; }
  .tricolore { width: 120px; height: 5px; border-radius: 3px; margin: 0 0 16px; box-shadow: 0 0 0 1px var(--border); background: linear-gradient(90deg, var(--brand-green) 0 33.33%, #fff 33.33% 66.66%, var(--brand-red) 66.66%); }
  a { color: var(--accent-text); text-underline-offset: 2px; }

  nav.tabs {
    display: flex; gap: 4px; margin: 0 0 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav.tabs button {
    appearance: none; border: 0; background: none; color: var(--muted);
    font: 500 15px var(--sans); padding: 10px 14px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  @media (max-width: 480px) { nav.tabs { gap: 0; } nav.tabs button { padding: 10px 9px; font-size: 14px; } }
  .panel[hidden] { display: none; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .sticky { position: sticky; top: 16px; }
  @media (max-width: 860px) { .sticky { position: static; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font: 600 19px/1.3 var(--serif); margin: 0 0 4px; }
  .card h3 { font: 600 13px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  .field { margin: 16px 0; }
  .field:first-of-type { margin-top: 8px; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .field-head label { font-weight: 600; }
  .field-head output, .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .hint.warn { color: var(--amber); }

  /* Sliders: green fill with a red thumb (the brand's two colours) */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px; margin: 2px 0; background: transparent; cursor: pointer;
    --fill: 50%;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--brand-green) var(--fill), var(--border) var(--fill));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
    background: var(--brand-red); border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  }
  input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--border); }
  input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--brand-green); }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--brand-red); border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  }
  input[type="range"]:focus-visible { outline: none; }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--brand-red); }
  input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--brand-red); }
  input[type="number"], input[type="datetime-local"], select {
    font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  }
  input[type="number"] { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .stepper button { appearance: none; border: 0; background: none; color: var(--text); width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .stepper button:hover { background: var(--border); }
  .stepper input { border: 0; border-radius: 0; width: 56px; text-align: center; background: transparent; padding: 7px 0; -moz-appearance: textfield; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg label { position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 6px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); }
  .seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); }

  .check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }

  /* Results */
  .result-list { list-style: none; margin: 0; padding: 0; }
  .result-list li {
    display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .result-list li:last-child { border-bottom: 0; }
  .result-list .name { font-weight: 500; }
  .result-list .name small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .result-list .amt { font: 600 24px/1 var(--serif); font-variant-numeric: tabular-nums; text-align: right; }
  .result-list .amt .u { font: 500 14px var(--sans); color: var(--muted); margin-left: 2px; }
  .result-list .pct { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .total-row { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 4px; border-top: 2px solid var(--text); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font: 600 18px var(--serif); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat b small { display: block; font: 400 13px var(--sans); color: var(--muted); margin-top: 1px; }
  @media (max-width: 480px) {
    .stat { padding: 10px 8px; }
    .stat b { font-size: 16px; white-space: nowrap; }
  }

  .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .checks li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; }
  .checks li.ok { background: var(--green-soft); }
  .checks li.bad { background: var(--amber-soft); }
  .checks li::before { font-weight: 700; flex: none; width: 14px; }
  .checks li.ok { box-shadow: inset 3px 0 0 var(--green); }
  .checks li.bad { box-shadow: inset 3px 0 0 var(--amber); }
  .checks li.ok::before { content: "✓"; color: var(--green-text); }
  .checks li.bad::before { content: "!"; color: var(--amber); }

  ol.steps { margin: 0; padding-left: 20px; }
  ol.steps li { margin: 6px 0; }

  /* Timeline */
  .timeline { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
  .timeline li { position: relative; padding: 0 0 18px 30px; }
  .timeline li::before {
    content: ""; position: absolute; left: 0; top: 4px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--surface); border: 3px solid var(--accent);
  }
  .timeline li:last-child::before { background: var(--accent); }
  .timeline time { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
  .timeline .what { font-weight: 500; }
  .timeline .desc { color: var(--muted); font-size: 13.5px; }

  /* Toppings */
  .pizza-rows { display: grid; gap: 4px; }
  .pizza-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .pizza-row:last-child { border-bottom: 0; }
  .pizza-row .pname { font-weight: 600; }
  .pizza-row .pdesc { color: var(--muted); font-size: 12.5px; }
  table.shop { width: 100%; border-collapse: collapse; }
  table.shop td { padding: 9px 0; border-bottom: 1px solid var(--border); vertical-align: baseline; }
  table.shop tr:last-child td { border-bottom: 0; }
  table.shop td.q { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
  table.shop td small { color: var(--muted); display: block; font-size: 12px; }
  .empty { color: var(--muted); font-style: italic; padding: 12px 0; }

  /* Reference */
  table.ref { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.ref th, table.ref td { text-align: left; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.ref th { color: var(--muted); font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
  table.ref td:first-child { font-weight: 500; }
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

  .note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font: 500 14px var(--sans); padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  footer { color: var(--muted); font-size: 12.5px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  a.est { text-decoration: none; font-weight: 700; padding: 0 2px; }
  #yeast-note:target { background: var(--amber-soft); color: var(--text); border-radius: 4px; }

  header.masthead .wrap { position: relative; }
  header .lang {
    position: absolute; top: 16px; right: 16px;
    font: 500 14px var(--sans); color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  @media (max-width: 480px) { header.masthead .wrap { padding-top: 60px; } }

  :root:lang(ja) {
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  :root:lang(zh) {
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", SimSun, "Noto Serif SC", serif;
  }

  /* Buttons used by the guided recipe */
  .btn.go { background: var(--brand-green); border-color: var(--brand-green); color: #fff; font-weight: 600; }
  .btn.go:hover { background: #12924b; border-color: #12924b; }
  .btn.big { display: block; width: 100%; padding: 12px 16px; font-size: 16px; margin-top: 16px; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .linkbtn { display: block; margin: 8px auto 0; padding: 4px 8px; background: none; border: 0; font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .linkbtn:hover { color: var(--accent-text); }
  .linkbtn[hidden] { display: none; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* General procedure dialog */
  header .source .howto-cta { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--border); color: var(--text); max-width: none; }
  .howto-cta a { font-weight: 600; }
  dialog.howto {
    width: min(620px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 24px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); box-shadow: var(--shadow);
  }
  dialog.howto::backdrop { background: rgba(28, 28, 26, .55); }
  .howto-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .howto-head h2 { margin: 0; font: 600 clamp(24px, 5vw, 30px)/1.2 var(--serif); }
  .howto-intro { color: var(--muted); font-size: 16px; margin: 8px 0 20px; }
  .howto-steps { list-style: none; margin: 0; padding: 0; }
  .howto-steps li { position: relative; padding: 0 0 18px 30px; font-size: clamp(18px, 4.4vw, 20px); line-height: 1.45; }
  .howto-steps li::before { content: ""; position: absolute; left: 4px; top: .45em; width: 12px; height: 12px; border-radius: 50%; background: var(--brand-green); }
  .howto-steps li::after { content: ""; position: absolute; left: 9px; top: calc(.45em + 16px); bottom: 2px; width: 2px; background: var(--border); }
  .howto-steps li:last-child { padding-bottom: 0; }
  .howto-steps li:last-child::before { background: var(--brand-red); }
  .howto-steps li:last-child::after { display: none; }
  @media (max-width: 480px) { dialog.howto { padding: 18px 16px; } }

  /* Guided recipe */
  body.guide-open { overflow: hidden; }
  .guide { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
  .guide-inner { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  .guide-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .guide-count { font-weight: 600; color: var(--muted); }
  .guide-tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .guide-bar { height: 6px; border-radius: 3px; background: var(--border); margin: 12px 0 20px; overflow: hidden; }
  .guide-bar span { display: block; height: 100%; background: var(--brand-green); transition: width .3s; }
  .guide-card h2 { font-size: clamp(22px, 5vw, 30px); line-height: 1.25; margin-bottom: 10px; }
  .guide-card h2:focus { outline: none; }
  .guide-detail { font-size: 16px; margin: 0; }
  .guide-timer { position: relative; width: min(260px, 70vw); aspect-ratio: 1; margin: 24px auto 4px; }
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring-bg { stroke: var(--border); }
  .ring-fg { stroke: var(--brand-green); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring-text .time { font: 600 clamp(36px, 10vw, 52px)/1 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ring-text .time small { font-size: .42em; font-weight: 500; color: var(--muted); margin: 0 .3em 0 .08em; }
  .ring-text .time small:last-child { margin-right: 0; }
  .ring-text .time.long { font-size: clamp(30px, 8vw, 42px); }
  .ring-text .tsub { color: var(--muted); font-size: 13px; margin-top: 6px; padding: 0 20px; }
  .guide-timer.over .ring-fg { stroke: var(--brand-red); }
  .guide-timer.over .time { color: var(--accent-text); }
  .guide-timer.done .time { color: var(--green-text); }
  .guide-alert { text-align: center; font-weight: 600; font-size: 16px; min-height: 1.5em; margin: 8px 0 0; }
  .guide-alert.over { color: var(--accent-text); }
  .guide-nav { display: flex; gap: 8px; }
  .guide-nav .btn { padding: 12px 16px; font-size: 15px; }
  .guide-nav .go { flex: 1; }
  @media (max-width: 480px) {
    .guide-nav { flex-wrap: wrap; }
    .guide-nav .go { flex: 1 1 100%; order: -1; }
    .guide-nav .btn:not(.go) { flex: 1; }
  }
  .guide-keep { text-align: center; margin-top: 16px; }
  .guide-pill {
    position: fixed; right: 16px; bottom: 16px; z-index: 40; max-width: calc(100% - 32px);
    background: var(--brand-green); color: #fff; border: 0; border-radius: 999px; padding: 10px 16px;
    font: 600 14px var(--sans); font-variant-numeric: tabular-nums; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); cursor: pointer;
  }
  .guide-pill.over { background: var(--brand-red); }

  @media print {
    nav.tabs, .no-print { display: none !important; }
    .panel[hidden] { display: block; }
    body { background: #fff; }
    .card { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>Pizano</h1>
        <div class="tricolore" aria-hidden="true"></div>
      </div>
      <select id="lang" class="lang no-print" data-i18n-attr="aria-label:lang.label">
        <option value="en">English</option>
        <option value="it">Italiano</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="ja">日本語</option>
        <option value="zh">简体中文</option>
      </select>
    </div>
    <p data-i18n="intro"></p>
    <div class="source">
      <strong data-i18n="source.title"></strong>
      <span data-i18n="source.body"></span>
      <p class="howto-cta no-print" data-i18n="howto.cta"></p>
    </div>
  </div>
</header>
<div class="wrap">

  <nav class="tabs no-print" role="tablist">
    <button role="tab" aria-selected="true" data-tab="dough" data-i18n="tab.dough"></button>
    <button role="tab" aria-selected="false" data-tab="schedule" data-i18n="tab.schedule"></button>
    <button role="tab" aria-selected="false" data-tab="toppings" data-i18n="tab.toppings"></button>
    <button role="tab" aria-selected="false" data-tab="reference" data-i18n="tab.reference"></button>
  </nav>

  <!-- DOUGH -->
  <section class="panel" id="panel-dough">
    <div class="grid">
      <div>
        <div class="card">
          <h2 data-i18n="balls.title"></h2>
          <p class="sub" data-i18n="balls.sub"></p>

          <div class="field">
            <div class="field-head">
              <label for="count" data-i18n="count.label"></label>
              <div class="stepper">
                <button type="button" data-step="-1" data-i18n-attr="aria-label:count.fewer">−</button>
                <input type="number" id="count" min="1" max="500" value="6" inputmode="numeric">
                <button type="button" data-step="1" data-i18n-attr="aria-label:count.more">+</button>
              </div>
            </div>
          </div>

          <div class="field">
            <div class="field-head"><label for="ball" data-i18n="ball.label"></label><output id="ballOut"></output></div>
            <input type="range" id="ball" min="180" max="300" step="5" value="250">
            <div class="hint" id="ballHint"></div>
          </div>

          <div class="field">
            <div class="field-head"><label for="waste" data-i18n="waste.label"></label><output id="wasteOut"></output></div>
            <input type="range" id="waste" min="0" max="10" step="0.5" value="2">
            <div class="hint" data-i18n="waste.hint"></div>
          </div>
        </div>

        <div class="card">
          <h2 data-i18n="fws.title"></h2>
          <p class="sub" data-i18n="fws.sub"></p>

          <div class="field">
            <div class="field-head"><label for="flourPerL" data-i18n="flour.label"></label><output id="flourPerLOut"></output></div>
            <input type="range" id="flourPerL" min="1600" max="1800" step="10" value="1700">
            <div class="hint" data-i18n="flour.hint"></div>
          </div>

          <div class="field">
            <div class="field-head"><label for="type1" data-i18n="type1.label"></label><output id="type1Out"></output></div>
            <input type="range" id="type1" min="0" max="20" step="1" value="0">
            <div class="hint" id="type1Hint"></div>
          </div>

          <div class="field">
            <div class="field-head"><label for="saltPerL" data-i18n="salt.label"></label><output id="saltPerLOut"></output></div>
            <input type="range" id="saltPerL" min="40" max="60" step="1" value="50">
            <div class="hint" data-i18n="salt.hint"></div>
          </div>
        </div>

        <div class="card">
          <h2 data-i18n="yeast.title"></h2>
          <p class="sub" data-i18n="yeast.sub"></p>

          <div class="field">
            <div class="field-head"><label data-i18n="leaven.label"></label></div>
            <div class="seg" role="radiogroup" data-i18n-attr="aria-label:leaven.aria">
              <label><input type="radio" name="yeastType" value="fresh" checked><span data-i18n="y.fresh"></span></label>
              <label><input type="radio" name="yeastType" value="dry"><span data-i18n="y.dry"></span></label>
              <label><input type="radio" name="yeastType" value="sourdough"><span data-i18n="y.sd"></span></label>
            </div>
          </div>

          <div class="field">
            <div class="field-head"><label for="hours" data-i18n="hours.label"></label><output id="hoursOut"></output></div>
            <input type="range" id="hours" min="8" max="30" step="1" value="18">
          </div>

          <div class="field">
            <div class="field-head"><label for="temp" data-i18n="temp.label"></label><output id="tempOut"></output></div>

    "intro": "Rechner für Teig, Zeitplan und Belag echter neapolitanischer Pizza, nach den offiziellen AVPN-Richtlinien. Der Name Pizano geht auf <em>paesano</em> zurück, was auf Italienisch einen Landsmann, Nachbarn oder jemanden mit derselben regionalen Herkunft bezeichnet. Unter Italoamerikanern bezeichnet es einen Freund oder anderen Italoamerikaner.",
    "source.title": "Alle Zahlen auf dieser Seite stammen aus dem offiziellen internationalen Regelwerk der AVPN (Associazione Verace Pizza Napoletana)",
    "source.body": "Jede Menge, jeder Bereich und jeder Grenzwert auf dieser Seite stammt aus dem {regs}, dem Standard, den Pizzerien für die Zertifizierung als Verace Pizza Napoletana erfüllen müssen. Abschnittsnummern (z. B. §2.1.2) zeigen, woher jede Angabe stammt.",
    "howto.cta": "Wenn du den allgemeinen Ablauf für AVPN-konformen Pizzateig nachlesen möchtest, findest du <a href=\"#howto\" class=\"howto-open\">die Anleitung hier</a>.",
    "howto.title": "So entsteht neapolitanische Pizza",
    "howto.intro": "Der allgemeine Ablauf nach dem AVPN-Regelwerk, in einfachen Worten. Die genauen Mengen und Zeiten liefert der Rechner.",
    "howto.s1": "Das Wasser in die Knetmaschine gießen.",
    "howto.s2": "Das Salz im Wasser auflösen.",
    "howto.s3": "Die Hefe hinzufügen.",
    "howto.s4": "Die Maschine starten und das Mehl nach und nach zugeben, bis der Teig zusammenkommt.",
    "howto.s5": "Kneten, bis der Teig glatt, weich und leicht klebrig ist.",
    "howto.s6": "Den Teig abdecken und für die erste Gare bei Raumtemperatur ruhen lassen.",
    "howto.s7": "Den Teig von Hand zu Teiglingen formen und in eine abgedeckte Kiste legen.",
    "howto.s8": "Die Teiglinge ein zweites Mal gehen lassen, bis sie weich und luftig sind.",
    "howto.s9": "Den Holzofen anheizen, bis er sehr heiß ist.",
    "howto.s10": "Jeden Teigling von Hand von der Mitte nach außen drücken und ausziehen, sodass die Luft in den Rand wandert. Niemals Nudelholz oder Maschine verwenden.",
    "howto.s11": "Belegen, zuerst mit Tomate, spiralförmig von der Mitte aus verteilt.",
    "howto.s12": "Die Pizza in den Ofen schieben und schnell backen, dabei drehen, damit sie gleichmäßig gart.",

    "source.title": "このページの数値はすべて、AVPN（Associazione Verace Pizza Napoletana）公式国際規約に基づいています",
    "source.body": "このページの分量・範囲・上限はすべて{regs}に基づいています。これは、ピッツェリアが「Verace Pizza Napoletana」の認証を受けるために満たすべき基準です。セクション番号（例：§2.1.2）は各数値の出典を示します。",
    "howto.cta": "AVPN準拠のピッツァ生地づくりの基本的な流れを確認したい場合は、<a href=\"#howto\" class=\"howto-open\">こちらの手順をご覧ください</a>。",
    "howto.title": "ナポリピッツァのつくり方",
    "howto.intro": "AVPN規約に基づく基本的な流れを、わかりやすくまとめました。正確な分量と時間は計算ツールで確認できます。",
    "howto.s1": "ミキサーに水を入れます。",
    "howto.s2": "水に塩を溶かします。",
    "howto.s3": "酵母を加えます。",
    "howto.s4": "ミキサーを回し、生地がまとまるまで小麦粉を少しずつ加えます。",
    "howto.s5": "生地がなめらかで柔らかく、少しべたつく程度になるまでこねます。",
    "howto.s6": "生地に覆いをして、室温で一次発酵させます。",
    "howto.s7": "生地を手で分割して丸め、ふた付きの容器に並べます。",
    "howto.s8": "生地玉が柔らかくふっくらするまで、二次発酵させます。",
    "howto.s9": "薪窯を十分に高温になるまで熱します。",
    "howto.s10": "生地玉を手で中心から外側へ押し広げ、空気を縁に寄せます。めん棒や機械は決して使いません。",
    "howto.s11": "トマトから始め、中心から渦を描くようにトッピングをのせます。",
    "howto.s12": "ピッツァを窯に入れ、均一に焼けるよう回しながら短時間で焼き上げます。",
    "howto.s13": "焼き上がったピッツァは柔らかく弾力があり、縁は高く黄金色で、具材は香り豊かです。",
    "howto.close": "閉じる",

    "guide.restartConfirm": "要从头重新开始分步引导吗？正在运行的计时器将被清除。",
    "guide.end": "结束",
    "guide.endLong": "结束分步引导",
    "guide.endConfirm": "要结束分步引导吗？进度和正在运行的计时器将被清除。",
    "guide.back": "上一步",
    "guide.next": "下一步",
    "guide.sound": "声音",
    "guide.notify": "通知我",
    "guide.keepOpen": "请保持此页面打开：只有页面打开时计时器才能提醒你。进度会保存在此浏览器中。",
    "guide.endsAt": "{time} 结束",
    "guide.timeUp": "时间到",
    "guide.pill": "{step} · {time}",
    "guide.hm": "{h} 小时 {m} 分钟",
    "g.water.t": "将 {g} g 水倒入和面机",
    "g.water.d": "16–22 °C 的非气泡饮用水。和面总是从水开始。",
    "g.salt.t": "加入 {g} g 盐",
    "g.salt.d": "让盐在水中溶解。",
    "g.yeast.t.fresh": "加入 {g} g 鲜酵母",
    "g.yeast.t.dry": "加入 {g} g 干酵母",
    "g.yeast.t.sd": "加入 {g} g 天然酵种",
    "g.yeast.d": "将其溶于水中。5 分钟计时已开始：盐和酵母在一起不得超过这个时间，所以请在计时结束前开始加入面粉。",
    "g.yeast.up": "现在就开始加入面粉！",
    "g.flour.t": "逐步加入 {g} g 面粉",
    "g.flour.tMix": "逐步加入混合好的 {a} g“00”号面粉和 {b} g“1”号面粉",
    "g.flour.d": "启动和面机，在约 10 分钟内逐步加入面粉，直到面团成为一整块（punto di pasta）。",
    "g.flour.up": "已过约 10 分钟。面团成团后，进入揉面步骤。",
    "g.knead.t": "揉面最多 20 分钟",
    "g.knead.d": "揉到面团光滑并能从盆壁脱离（punto di corda）。一旦揉好就停下：过度揉面会使面团升温并损伤面筋。",
    "g.knead.up": "20 分钟是上限。现在停止揉面！",
    "g.bulk.t": "第一次发酵：{h} 小时",
    "g.bulk.d": "将面团从和面机中取出，盖上湿布以免表面变干，整块静置。",
    "g.bulk.up": "第一次发酵完成。现在分割面团。",
    "g.staglio.t": "分割成 {n} 个 {w} g 的面团球",
    "g.staglio.d": "用刮刀切分面团，用手将每块揉成光滑的球，放入带盖的发酵盒。",
    "g.proof.t": "第二次发酵：{h} 小时",
    "g.proof.d": "让面团球在带盖的盒中发酵，最好在 18–20 °C、湿度 60–70% 的环境下。结束前 1 小时会提醒你预热烤炉。",
    "g.proof.oven": "该预热烤炉了：面团将在 1 小时后准备好。",
    "g.proof.up": "面团已准备好。",
    "g.done.t": "可以烘烤了",
    "g.done.d": "面球已经准备好了。用手从中心向外拉开（不用擀面杖），放上配料，在窑底约 380–430 °C 的温度下烤 60–90 秒。Buon appetito！",
    "g.done.btn": "完成",
  },
};
</script>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STORE_KEY = "pizzacalc.v1";
  const REGS_URL = "https://www.pizzanapoletana.org/en/ricetta_pizza_napoletana";
  const LOCALES = { en: "en-GB", it: "it-IT", de: "de-DE", fr: "fr-FR", es: "es-ES", ja: "ja-JP", zh: "zh-CN" };

  // ---------- Language ----------
  let lang = "en";
  const locale = () => LOCALES[lang];
  function t(key, vars) {
    let s = I18N[lang][key] ?? I18N.en[key] ?? key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
    return s;
  }
  // Picks key_one or key_other by count and passes the count as {n}.
  const tn = (key, n, vars) => t(key + (n === 1 ? "_one" : "_other"), { n, ...vars });

  function applyStatic() {
    document.documentElement.lang = lang;
    const vars = { regs: `<a href="${REGS_URL}" target="_blank" rel="noopener">${t("regsName")}</a>` };
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = t(el.dataset.i18n, vars); });
    document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
      el.dataset.i18nAttr.split(";").forEach((pair) => {
        const [attr, key] = pair.split(":");
        el.setAttribute(attr, t(key));
      });
    });
    // Plain numbers in the reference tables: swap the decimal point for the locale's separator.
    const dec = (1.5).toLocaleString(locale()).charAt(1);
    document.querySelectorAll(".num").forEach((el) => {
      if (!el.dataset.src) el.dataset.src = el.textContent;
      el.textContent = dec === "." ? el.dataset.src : el.dataset.src.replace(/(\d)\.(\d)/g, `$1${dec}$2`);
    });
  }

  // ---------- Tabs ----------
  const tabs = document.querySelectorAll("nav.tabs button");
  function showTab(name) {
    tabs.forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    document.querySelectorAll(".panel").forEach((p) => { p.hidden = p.id !== "panel-" + name; });
    state.tab = name;
    save();
  }
  tabs.forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));

  // ---------- Formatting ----------
  const fmtG = (g) => {
    if (g >= 100) return Math.round(g).toLocaleString(locale());
    if (g >= 10) return (Math.round(g * 10) / 10).toLocaleString(locale());
    return (Math.round(g * 100) / 100).toLocaleString(locale());
  };
  const fmtNum = (n, d = 0) => n.toLocaleString(locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmtVal = (n) => n.toLocaleString(locale());
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const est = () => `<a class="est" href="#yeast-note" title="${t("est.title")}">*</a>`;

  // ---------- Model ----------
  // Ball weight → expected diameter, interpolated from the two examples in §2.1.2.
  function diameterFor(w) {
    const f = (w - 200) / 80;
    return [22 + f * 6, 24 + f * 11];
  }

  // Diameter range for display: English shows inches (to the nearest ½) with cm after.
  function diamText(lo, hi) {
    const cm = `${Math.round(lo)}–${Math.round(hi)} cm`;
    if (lang !== "en") return cm;
    const inch = (c) => { const h = Math.round(c / 2.54 * 2) / 2; return Math.floor(h) + (h % 1 ? "½" : ""); };
    return `${inch(lo)}–${inch(hi)} in (${cm})`;
  }

  // Rough estimate of fresh yeast (g per litre of water) for a given total
  // fermentation time and temperature. Reference: ~2 g/L for 12 h at 20 °C;
  // longer rises need less yeast, and activity roughly doubles every ~9 °C.
  function suggestFreshYeast(hours, temp) {
    const g = 2.0 * Math.pow(12 / hours, 1.2) * Math.pow(2.2, (20 - temp) / 10);
    return clamp(Math.round(g * 20) / 20, 0.1, 3);
  }

  const defaults = {
    count: 6, ball: 250, waste: 2,
    flourPerL: 1700, type1: 0, saltPerL: 50,
    yeastType: "fresh", hours: 18, temp: 19, autoYeast: true, freshPerL: 1, sdPct: 5,
    bulk: 2, bakeAt: null,
    pizzas: { margherita: 4, marinara: 2 }, optionals: true, sanMarzano: false,
    tab: "dough",
  };
  let state = { ...defaults, pizzas: { ...defaults.pizzas } };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved === "object") state = { ...state, ...saved, pizzas: { ...(saved.pizzas || defaults.pizzas) } };
  } catch (e) { /* storage unavailable */ }

  // Saved choice first, then the browser's language, then English.
  const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
  lang = I18N[state.lang] ? state.lang : I18N[browserLang] ? browserLang : "en";

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function computeDough() {
    const s = state;
    const fresh = s.autoYeast ? suggestFreshYeast(s.hours, s.temp) : s.freshPerL;
    const perL = { water: 1000, flour: s.flourPerL, salt: s.saltPerL, yeast: 0, sourdough: 0 };
    if (s.yeastType === "fresh") perL.yeast = fresh;
    if (s.yeastType === "dry") perL.yeast = fresh / 3;
    if (s.yeastType === "sourdough") perL.sourdough = s.flourPerL * s.sdPct / 100;
    const perLTotal = perL.water + perL.flour + perL.salt + perL.yeast + perL.sourdough;

    const target = s.count * s.ball * (1 + s.waste / 100);
    const k = target / perLTotal;
    const flour = perL.flour * k;
    return {
      fresh,
      target,
      water: perL.water * k,
      flour,
      flour1: flour * s.type1 / 100,
      flour00: flour * (1 - s.type1 / 100),
      salt: perL.salt * k,
      yeast: perL.yeast * k,
      sourdough: perL.sourdough * k,
      hydration: 1000 / s.flourPerL * 100,
    };
  }

  // ---------- Dough UI ----------
  const bindRange = (id) => {
    const el = $(id);
    el.value = state[id];
    el.addEventListener("input", () => {
      state[id] = parseFloat(el.value);
      if (id === "freshPerL") { state.autoYeast = false; $("autoYeast").checked = false; }
      render();
    });
  };
  const rangeFmt = {
    ball: (v) => v + " g",
    waste: (v) => fmtVal(v) + "%",
    flourPerL: (v) => fmtVal(v) + " g",
    type1: (v) => (v === 0 ? t("none") : v + "%"),
    saltPerL: (v) => v + " g",
    hours: (v) => v + " h",
    temp: (v) => v + " °C",
    freshPerL: (v) => fmtNum(v, 2) + " g",
    sdPct: (v) => fmtVal(v) + "%",
    bulk: (v) => fmtVal(v) + " h",
  };
  Object.keys(rangeFmt).forEach(bindRange);

  const countEl = $("count");
  countEl.value = state.count;
  countEl.addEventListener("input", () => {
    const v = parseInt(countEl.value, 10);
    if (v >= 1) { state.count = Math.min(v, 500); render(); }
  });
  countEl.addEventListener("blur", () => { countEl.value = state.count; });
  document.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
    state.count = clamp(state.count + parseInt(b.dataset.step, 10), 1, 500);
    countEl.value = state.count;
    render();
  }));

  document.querySelectorAll('input[name="yeastType"]').forEach((r) => {
    r.checked = r.value === state.yeastType;
    r.addEventListener("change", () => { state.yeastType = r.value; render(); });
  });
  $("autoYeast").checked = state.autoYeast;
  $("autoYeast").addEventListener("change", (e) => { state.autoYeast = e.target.checked; render(); });

  function renderDough(d) {
    const s = state;
    Object.entries(rangeFmt).forEach(([id, f]) => { const o = $(id + "Out"); if (o) o.textContent = f(s[id]); });

    // Keep the yeast slider showing the suggestion when auto is on.
    if (s.autoYeast) { $("freshPerL").value = d.fresh; $("freshPerLOut").textContent = fmtNum(d.fresh, 2) + " g"; }

    const [dLo, dHi] = diameterFor(s.ball);
    const ballOk = s.ball >= 200 && s.ball <= 280;
    $("ballHint").textContent = ballOk ? t("ball.ok", { size: diamText(dLo, dHi) }) : t("ball.bad");
    $("ballHint").classList.toggle("warn", !ballOk);

    const t1 = s.type1;
    const t1Low = t1 > 0 && t1 < 5;
    $("type1Hint").classList.toggle("warn", t1Low);
    $("type1Hint").textContent = t(t1Low ? "type1.warn" : "type1.hint");

    const isSd = s.yeastType === "sourdough";
    $("commercialYeast").hidden = isSd;
    $("sourdoughBox").hidden = !isSd;
    $("freshPerL").disabled = false;
    const dry = s.yeastType === "dry";
    const freshNow = s.autoYeast ? d.fresh : s.freshPerL;
    $("yeastHint").innerHTML = (s.autoYeast ? t("yeast.auto", { h: s.hours, t: s.temp, est: est() }) : t("yeast.manual")) +
      (dry ? t("yeast.dryNote", { g: fmtNum(freshNow / 3, 2) }) : "");

    // Results
    const pct = (g) => fmtNum(g / d.flour * 100, g / d.flour * 100 < 1 ? 2 : 1) + "%";
    const rows = [
      [t("r.water"), t("r.waterSub"), d.water, pct(d.water)],
    ];
    if (s.type1 > 0) {
      rows.push([t("r.flour00"), t("r.flour00Sub"), d.flour00, pct(d.flour00)]);
      rows.push([t("r.flour1"), t("r.flour1Sub", { p: s.type1 }), d.flour1, pct(d.flour1)]);
    } else {
      rows.push([t("r.flour00"), t("r.flour00SubW"), d.flour, "100%"]);
    }
    rows.push([t("r.salt"), t("r.saltSub"), d.salt, pct(d.salt)]);
    const estTxt = s.autoYeast ? t("r.estimated") + est() : "";
    if (s.yeastType === "fresh") rows.push([t("r.fresh"), t("r.freshSub") + estTxt, d.yeast, pct(d.yeast)]);
    if (dry) rows.push([t("r.dry"), t("r.drySub") + estTxt, d.yeast, pct(d.yeast)]);
    if (isSd) rows.push([t("r.sd"), t("r.sdSub"), d.sourdough, pct(d.sourdough)]);

    $("results").innerHTML = rows.map(([n, sub, g, p]) =>
      `<li><span class="name">${n}<small>${sub}</small></span><span class="amt">${fmtG(g)}<span class="u">g</span></span><span class="pct">${p}</span></li>`
    ).join("");
    $("totalDough").textContent = fmtG(d.target) + " g";
    $("doughSummary").textContent = tn("sum.balls", s.count, { w: s.ball }) +
      (s.waste ? t("sum.extra", { p: fmtVal(s.waste) }) : "") + t("sum.pct");
    $("statHyd").textContent = fmtNum(d.hydration, 1) + "%";
    // The stat tile is narrow, so the cm part goes on its own smaller line.
    const diam = diamText(dLo, dHi).match(/^(.*?)(?: \((.*)\))?$/);
    $("statDiam").textContent = diam[1];
    if (diam[2]) $("statDiam").appendChild(Object.assign(document.createElement("small"), { textContent: diam[2] }));
    $("statWaterT").textContent = "16–22 °C";

    // Checks
    const hoursOk = s.hours >= 12 && s.hours <= 24;
    const checks = [
      [ballOk, t(ballOk ? "c.ballOk" : "c.ballBad", { w: s.ball })],
      [true, t("c.hyd", { h: fmtNum(d.hydration, 1), f: fmtVal(s.flourPerL) })],
      [true, t("c.salt", { s: s.saltPerL })],
      [t1 === 0 || (t1 >= 5 && t1 <= 20), t(t1 === 0 ? "c.t1none" : t1 >= 5 ? "c.t1ok" : "c.t1low", { p: t1 })],
      [hoursOk, t(hoursOk ? "c.hoursOk" : "c.hoursBad", { h: s.hours })],
    ];
    if (!isSd) checks.push([freshNow >= 0.1 && freshNow <= 3, t("c.yeast", { g: fmtNum(freshNow, 2) })]);
    else checks.push([s.sdPct < 10, t("c.sd", { p: fmtVal(s.sdPct) })]);
    const tempOk = s.temp >= 16 && s.temp <= 22;
    checks.push([tempOk, t(tempOk ? "c.tempOk" : "c.tempBad", { t: s.temp })]);
    $("checks").innerHTML = checks.map(([ok, txt]) => `<li class="${ok ? "ok" : "bad"}">${txt}</li>`).join("");

    // Mixing steps
    const leaven = isSd ? t("m.leavenSd", { g: fmtG(d.sourdough) }) : t(dry ? "m.leavenDry" : "m.leavenFresh", { g: fmtG(d.yeast) });
    const flourTxt = s.type1 > 0 ? t("m.flourMix", { a: fmtG(d.flour00), b: fmtG(d.flour1) }) : t("m.flour", { g: fmtG(d.flour) });
    $("mixSteps").innerHTML = [
      t("m.s1", { g: fmtG(d.water) }),
      t("m.s2", { g: fmtG(d.salt) }),
      t("m.s3", { leaven }),
      t("m.s4", { flour: flourTxt }),
      t("m.s5"),
      t("m.s6", { n: s.count, w: s.ball }),
    ].map((txt) => `<li>${txt}</li>`).join("");
  }

  // ---------- Schedule ----------
  function defaultBakeAt() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(19, 0, 0, 0);
    return toLocalInput(d);
  }
  function toLocalInput(d) {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  if (!state.bakeAt) state.bakeAt = defaultBakeAt();
  $("bakeAt").value = state.bakeAt;
  $("bakeAt").addEventListener("input", (e) => { if (e.target.value) { state.bakeAt = e.target.value; render(); } });

  function fmtWhen(d) {
    return d.toLocaleString(locale(), { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function renderSchedule() {
    const s = state;
    const bake = new Date(s.bakeAt);
    if (isNaN(bake)) return;
    const bulk = Math.min(s.bulk, s.hours - 1);
    const fermentStart = new Date(bake.getTime() - s.hours * 3600e3);
    const mixStart = new Date(fermentStart.getTime() - 30 * 60e3);
    const staglio = new Date(fermentStart.getTime() + bulk * 3600e3);
    const ovenOn = new Date(bake.getTime() - 60 * 60e3);

    $("schedHours").textContent = t("s.hoursAt", { h: s.hours, t: s.temp });
    const warn = [];
    if (s.hours < 12 || s.hours > 24) warn.push(t("s.outside"));
    if (s.bulk > s.hours - 1) warn.push(t("s.bulkShort", { b: fmtVal(bulk) }));
    $("schedWarn").textContent = warn.join(" ");
    $("schedWarn").classList.toggle("warn", warn.length > 0);

    const ballProof = s.hours - bulk;
    const items = [
      [mixStart, t("tl.mix"), t("tl.mixD", { leaven: t(s.yeastType === "sourdough" ? "tl.sd" : "tl.yeast") })],
      [fermentStart, t("tl.bulk"), t("tl.bulkD", { b: fmtVal(bulk) })],
      [staglio, t("tl.staglio"), t("tl.staglioD", { n: s.count, w: s.ball, p: fmtNum(ballProof, ballProof % 1 ? 1 : 0) })],
      [ovenOn, t("tl.oven"), t("tl.ovenD")],
      [bake, t("tl.bake"), t("tl.bakeD")],
    ];
    $("timeline").innerHTML = items.map(([when, what, desc]) =>
      `<li><time>${fmtWhen(when)}</time><div class="what">${what}</div><div class="desc">${desc}</div></li>`
    ).join("");
  }

  // ---------- Toppings ----------
  // [key, min, max, unit, optional]; names, descriptions and units come from I18N.
  const TBSP = 15; // grams of crushed peeled tomato per tablespoon (approx.)
  const RECIPES = {
    margherita: { name: "Margherita", items: [
      ["tomato", 60, 80, "g"], ["oil", 6, 7, "g"], ["fdl", 80, 100, "g"], ["basil", 3, 5, "leaves"], ["grated", 5, 7, "g", true]] },
    marinara: { name: "Marinara", items: [
      ["tomato", 0, 100, "g"], ["oil", 6, 8, "g"], ["garlic", 1, 1, "cloves"], ["oregano", 0.5, 0.5, "g"], ["basil", 2, 3, "leaves", true]] },
    quattro: { name: "Quattro stagioni", items: [
      ["cherry", 20, 20, "g"], ["tomato", TBSP, TBSP, "g"], ["oil", 5, 5, "g"], ["fdl", 40, 40, "g"], ["buffalo", 10, 10, "g"],
      ["basil", 2, 4, "leaves"], ["salami", 15, 15, "g"], ["mushSauteed", 20, 20, "g"], ["artichoke", 2, 2, "segments"], ["olives", 4, 4, "pcs"]] },
    capricciosa: { name: "Capricciosa", items: [
      ["tomato", 80, 80, "g"], ["oil", 10, 10, "g"], ["fdl", 80, 100, "g"], ["basil", 3, 5, "leaves"], ["grated", 10, 10, "g", true],
      ["ham", 2, 2, "slices"], ["mushrooms", 50, 50, "g"], ["artichoke", 2, 2, "pcs"], ["garlic", 1, 1, "cloves"]] },
    calzone: { name: "Ripieno / Calzone", items: [
      ["tomato", TBSP / 2, TBSP / 2, "g"], ["oil", 6, 7, "g"], ["ricotta", 120, 120, "g"], ["salami", 40, 40, "g"], ["fdl", 70, 70, "g"],
      ["basil", 3, 5, "leaves"], ["grated", 5, 7, "g"], ["pepper", 0, 0, "taste"]] },
    fried: { name: "Pizza fritta", items: [
      ["ricotta", 80, 90, "g"], ["fdlProvola", 30, 50, "g"], ["salamiCicoli", 50, 60, "g"], ["pepper", 0, 0, "taste"], ["tomato", 15, 30, "g", true]] },
  };
  // Shopping-list order.
  const INGREDIENTS = ["tomato", "cherry", "oil", "fdl", "buffalo", "fdlProvola", "basil", "grated", "garlic", "oregano",
    "salami", "salamiCicoli", "mushSauteed", "mushrooms", "artichoke", "olives", "ham", "ricotta", "pepper"];

  function renderPizzaRows() {
    $("pizzaRows").innerHTML = Object.entries(RECIPES).map(([k, r]) => `
      <div class="pizza-row">
        <div><div class="pname">${r.name}</div><div class="pdesc">${t("pz." + k)}</div></div>
        <div class="stepper">
          <button type="button" data-pz="${k}" data-d="-1" aria-label="${t("pz.fewer", { name: r.name })}">−</button>
          <input type="number" min="0" max="500" value="${state.pizzas[k] || 0}" data-pzin="${k}" aria-label="${t("pz.count", { name: r.name })}" inputmode="numeric">
          <button type="button" data-pz="${k}" data-d="1" aria-label="${t("pz.more", { name: r.name })}">+</button>
        </div>
      </div>`).join("");
    $("pizzaRows").querySelectorAll("[data-pz]").forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.pz;
      state.pizzas[k] = clamp((state.pizzas[k] || 0) + parseInt(b.dataset.d, 10), 0, 500);
      $("pizzaRows").querySelector(`[data-pzin="${k}"]`).value = state.pizzas[k];
      render();
    }));
    $("pizzaRows").querySelectorAll("[data-pzin]").forEach((inp) => inp.addEventListener("input", () => {
      const v = parseInt(inp.value, 10);
      state.pizzas[inp.dataset.pzin] = isNaN(v) ? 0 : clamp(v, 0, 500);
      render();
    }));
  }

  function renderToppings() {
    const totals = {};
    let n = 0;
    Object.entries(RECIPES).forEach(([k, r]) => {
      const c = state.pizzas[k] || 0;
      if (!c) return;
      n += c;
      r.items.forEach(([key, lo, hi, unit, opt]) => {
        if (opt && !state.optionals) return;
        const tot = totals[key] || (totals[key] = { lo: 0, hi: 0, unit });
        tot.lo += lo * c; tot.hi += hi * c;
      });
    });

    const fmtQ = (v, unit) => unit === "g" ? fmtG(v) : fmtVal(Math.round(v * 10) / 10);
    const rows = INGREDIENTS.filter((k) => totals[k]).map((k) => {
      const tot = totals[k];
      const name = t("ing." + k);
      const sub = I18N.en["ing." + k + ".sub"] ? t("ing." + k + ".sub") : "";
      let q;
      if (tot.unit === "taste") q = t("u.taste");
      else {
        const same = Math.abs(tot.lo - tot.hi) < 1e-9;
        q = (same ? fmtQ(tot.lo, tot.unit) : `${fmtQ(tot.lo, tot.unit)}–${fmtQ(tot.hi, tot.unit)}`) + " " + (tot.unit === "g" ? "g" : t("u." + tot.unit));
      }
      return `<tr><td>${name}${sub ? `<small>${sub}</small>` : ""}</td><td class="q">${q}</td></tr>`;
    });

    let summary = n ? tn("shop.for", n) : "";
    $("shop").innerHTML = rows.length ? rows.join("") : `<tr><td class="empty">${t("shop.empty")}</td></tr>`;

    const tom = totals.tomato;
    const [sLo, sHi] = state.sanMarzano ? [7, 10] : [10, 12];
    if (tom && tom.hi > 0) {
      const mid = (tom.lo + tom.hi) / 2;
      $("sauceNote").innerHTML = t("sauce", {
        g: fmtG(mid), lo: fmtNum(mid / 1000 * sLo, 1), hi: fmtNum(mid / 1000 * sHi, 1), a: sLo, b: sHi,
        sm: state.sanMarzano ? t("sauce.sm") : "",
      }) + (state.pizzas.quattro || state.pizzas.calzone ? t("sauce.tbsp") : "");
      $("sauceNote").hidden = false;
    } else {
      $("sauceNote").hidden = true;
    }

    if (n && n !== state.count) summary += tn("shop.dough", state.count);
    if (state.pizzas.fried && state.ball > 220) summary += t("shop.fried");
    $("shopSummary").textContent = summary;
  }

  $("optionals").checked = state.optionals;
  $("optionals").addEventListener("change", (e) => { state.optionals = e.target.checked; render(); });
  $("sanMarzano").checked = state.sanMarzano;
  $("sanMarzano").addEventListener("change", (e) => { state.sanMarzano = e.target.checked; render(); });
  $("matchDough").addEventListener("click", () => {
    state.pizzas = { margherita: state.count };
    renderPizzaRows();
    render();
  });

  // ---------- Actions ----------
  $("copyBtn").addEventListener("click", async () => {
    const d = computeDough();
    const s = state;
    const lines = [
      t("cp.title", { n: s.count, w: s.ball }),
      `${t("cp.water")}: ${fmtG(d.water)} g`,
      s.type1 > 0 ? `${t("cp.flour00")}: ${fmtG(d.flour00)} g\n${t("cp.flour1")}: ${fmtG(d.flour1)} g` : `${t("cp.flour00")}: ${fmtG(d.flour)} g`,
      `${t("cp.salt")}: ${fmtG(d.salt)} g`,
      s.yeastType === "sourdough" ? `${t("cp.sd")}: ${fmtG(d.sourdough)} g` : `${t(s.yeastType === "dry" ? "cp.dry" : "cp.fresh")}: ${fmtG(d.yeast)} g`,
      t("cp.summary", { h: fmtNum(d.hydration, 1), hours: s.hours, t: s.temp }),
    ];
    const btn = $("copyBtn");
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      btn.textContent = t("btn.copied");
    } catch (e) {
      btn.textContent = t("btn.copyFail");
    }
    setTimeout(() => { btn.textContent = t("btn.copy"); }, 1500);
  });
  $("printBtn").addEventListener("click", () => window.print());
  $("resetBtn").addEventListener("click", () => {
    state = { ...defaults, pizzas: { ...defaults.pizzas }, bakeAt: defaultBakeAt(), tab: state.tab, lang: state.lang };
    Object.keys(rangeFmt).forEach((id) => { $(id).value = state[id]; });
    countEl.value = state.count;
    $("autoYeast").checked = true;
    document.querySelectorAll('input[name="yeastType"]').forEach((r) => { r.checked = r.value === state.yeastType; });
    $("bakeAt").value = state.bakeAt;
    $("optionals").checked = state.optionals;
    $("sanMarzano").checked = state.sanMarzano;
    renderPizzaRows();
    render();
  });

  $("lang").value = lang;
  $("lang").addEventListener("change", (e) => {
    lang = e.target.value;
    state.lang = lang;
    applyStatic();
    renderPizzaRows();
    render();
    if (guideOpen) renderGuide();
  });

  // ---------- Guided recipe ----------
  // Walks through the recipe one step at a time, with timers for the limits in §2.1.3–2.3.
  // Timer start times are stored in state.guide, so a long fermentation survives a reload;
  // alarms can only sound while the page is open.
  const MIN = 60e3, HOUR = 3600e3;
  const RING = 2 * Math.PI * 52; // circumference of the timer ring (r = 52)
  let guideOpen = false;
  let audio = null;
  let lastBeep = 0;
  let wakeLock = null;

  function startGuide() {
    const d = computeDough();
    const s = state;
    const bulk = Math.max(0.5, Math.min(s.bulk, s.hours - 1));
    // Amounts are fixed when the guide starts, so changing a slider mid-recipe doesn't move them.
    state.guide = {
      step: 0, timers: {},
      snap: {
        water: d.water, salt: d.salt, yeast: d.yeast, sourdough: d.sourdough,
        flour: d.flour, flour00: d.flour00, flour1: d.flour1,
        yeastType: s.yeastType, type1: s.type1, count: s.count, ball: s.ball,
        bulk, proof: Math.max(0.5, s.hours - bulk),
      },
    };
  }

  // kind "limit": a maximum that must not be exceeded (keeps beeping when over).
  // kind "target": a duration to wait for (chimes once when done).
  function guideSteps(g) {
    const p = g.snap;
    const yeastKey = { fresh: "g.yeast.t.fresh", dry: "g.yeast.t.dry", sourdough: "g.yeast.t.sd" }[p.yeastType];
    const steps = [
      { id: "water", title: t("g.water.t", { g: fmtG(p.water) }), detail: t("g.water.d") },
      { id: "salt", title: t("g.salt.t", { g: fmtG(p.salt) }), detail: t("g.salt.d") },
      { id: "yeast", title: t(yeastKey, { g: fmtG(p.yeastType === "sourdough" ? p.sourdough : p.yeast) }), detail: t("g.yeast.d"),
        timer: { dur: 5 * MIN, kind: "limit", auto: true, up: t("g.yeast.up") } },
      { id: "flour", title: p.type1 > 0 ? t("g.flour.tMix", { a: fmtG(p.flour00), b: fmtG(p.flour1) }) : t("g.flour.t", { g: fmtG(p.flour) }),
        detail: t("g.flour.d"), timer: { dur: 10 * MIN, kind: "target", auto: true, up: t("g.flour.up") } },
      { id: "knead", title: t("g.knead.t"), detail: t("g.knead.d"),
        timer: { dur: 20 * MIN, kind: "limit", auto: true, up: t("g.knead.up") } },
      { id: "bulk", title: t("g.bulk.t", { h: fmtVal(p.bulk) }), detail: t("g.bulk.d"),
        timer: { dur: p.bulk * HOUR, kind: "target", auto: true, up: t("g.bulk.up") } },
      { id: "staglio", title: t("g.staglio.t", { n: p.count, w: p.ball }), detail: t("g.staglio.d") },
      { id: "proof", title: t("g.proof.t", { h: fmtVal(p.proof) }), detail: t("g.proof.d"),
        timer: { dur: p.proof * HOUR, kind: "target", auto: true, up: t("g.proof.up"), remind: { before: HOUR, text: t("g.proof.oven") } } },
      { id: "done", title: t("g.done.t"), detail: t("g.done.d") },
    ];
    // A guide saved by an older version of the page may point past the last step.
    g.step = Math.min(g.step, steps.length - 1);
    return steps;
  }

  // Under an hour: m:ss. From an hour up, seconds are just noise, so "13 h 05 min".
  // Returns plain text (tab title, pill) and HTML with smaller unit labels (the ring).
  function fmtDur(ms) {
    const sec = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const pad = (n) => String(n).padStart(2, "0");
    if (!h) { const txt = `${m}:${pad(s)}`; return { txt, html: txt }; }
    const parts = I18N[lang]["guide.hm"].split(/(\{[hm]\})/);
    const val = (p) => (p === "{h}" ? String(h) : pad(m));
    const txt = parts.map((p) => (/^\{[hm]\}$/.test(p) ? val(p) : p)).join("");
    // Unit labels hug their number; CSS margins do the spacing so it fits inside the ring.
    const html = parts.map((p) => (/^\{[hm]\}$/.test(p) ? val(p) : p.trim() ? `<small>${p.trim()}</small>` : "")).join("");
    return { txt, html };
  }
  const fmtClock = (ts) => new Date(ts).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });

  // Starts a step's timer on arrival if it runs on its own (e.g. kneading starts as soon as the flour is in).
  function enterStep() {
    const g = state.guide;
    const step = guideSteps(g)[g.step];
    if (step.timer && step.timer.auto && !g.timers[step.id]) g.timers[step.id] = { start: Date.now() };
  }

  function guideMove(dir) {
    const g = state.guide;
    const steps = guideSteps(g);
    const cur = steps[g.step];
    if (dir > 0) {
      const tm = g.timers[cur.id];
      if (tm && !tm.stopped) tm.stopped = Date.now();
      if (g.step < steps.length - 1) g.step++;
      else { state.guide = null; save(); closeGuide(); return; }
    } else {
      if (g.step > 0) g.step--;
    }
    enterStep();
    save();
    renderGuide(true);
  }

  function renderGuide(focus) {
    const g = state.guide;
    if (!g) return;
    const steps = guideSteps(g);
    const step = steps[g.step];
    const total = steps.length;
    const isLast = g.step === total - 1;
    const soundOn = state.guideSound !== false;
    const nextLabel = t(isLast ? "g.done.btn" : "guide.next");
    const canNotify = "Notification" in window && Notification.permission === "default";

    $("guide").innerHTML = `
      <div class="guide-inner">
        <div class="guide-top">
          <span class="guide-count">${t("guide.stepOf", { i: g.step + 1, n: total })}</span>
          <div class="guide-tools">
            <button type="button" class="btn small" id="gSound" aria-pressed="${soundOn}">${soundOn ? "🔔" : "🔕"} ${t("guide.sound")}</button>
            ${canNotify ? `<button type="button" class="btn small" id="gNotify">${t("guide.notify")}</button>` : ""}
            <button type="button" class="btn small" id="gRestart">${t("guide.restart")}</button>
            <button type="button" class="btn small" id="gEnd">${t("guide.end")}</button>
            <button type="button" class="btn small" id="gClose" aria-label="${t("guide.exit")}" title="${t("guide.exit")}">✕</button>
          </div>
        </div>
        <div class="guide-bar" aria-hidden="true"><span style="width:${(g.step + 1) / total * 100}%"></span></div>
        <div class="card guide-card">
          <h2 id="gTitle" tabindex="-1">${step.title}</h2>
          <p class="guide-detail">${step.detail}</p>
          ${step.timer ? `
          <div class="guide-timer" id="gTimer">
            <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
              <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
              <circle cx="60" cy="60" r="52" class="ring-fg" id="gRing" style="stroke-dasharray:${RING}"></circle>
            </svg>
            <div class="ring-text"><div class="time" id="gTime" role="timer"></div><div class="tsub" id="gSub"></div></div>
          </div>
          <p class="guide-alert" id="gAlert" role="status" aria-live="assertive"></p>` : ""}
        </div>
        <div class="guide-nav">
          <button type="button" class="btn" id="gBack" ${g.step === 0 ? "disabled" : ""}>${t("guide.back")}</button>
          <button type="button" class="btn go" id="gNext">${nextLabel}</button>
        </div>
        <p class="hint guide-keep">${t("guide.keepOpen")}</p>
      </div>`;

    $("gClose").addEventListener("click", closeGuide);
    $("gBack").addEventListener("click", () => { ensureAudio(); guideMove(-1); });
    $("gNext").addEventListener("click", () => { ensureAudio(); guideMove(1); });
    $("gSound").addEventListener("click", () => { state.guideSound = !soundOn; ensureAudio(); save(); renderGuide(); });
    if ($("gNotify")) $("gNotify").addEventListener("click", () => {
      Notification.requestPermission().then(() => renderGuide()).catch(() => {});
    });
    $("gRestart").addEventListener("click", () => {
      if (!confirm(t("guide.restartConfirm"))) return;
      startGuide();
      enterStep();
      save();
      renderGuide(true);
    });
    $("gEnd").addEventListener("click", endGuide);
    tickGuide();
    if (focus) $("gTitle").focus();
  }

  // Runs four times a second: updates the countdown and fires alarms, even when the guide is closed.
  function tickGuide() {
    const g = state.guide;
    const pill = $("guidePill");
    if (!g) { pill.hidden = true; document.title = "Pizano"; return; }
    const now = Date.now();
    const steps = guideSteps(g);
    const step = steps[g.step];
    let changed = false;

    // Alarms for any timer still running (going Back doesn't stop the later step's timer).
    steps.forEach((st) => {
      const tm = st.timer && g.timers[st.id];
      if (!tm || tm.stopped) return;
      const left = tm.start + st.timer.dur - now;
      if (st.timer.remind && !tm.reminded && left <= st.timer.remind.before) {
        tm.reminded = changed = true;
        if (left > 0) alarm(st.timer.remind.text, 2);
      }
      if (!tm.ended && left <= 0) {
        tm.ended = changed = true;
        alarm(st.timer.up, st.timer.kind === "limit" ? 4 : 3);
      }
      // A limit that has run over keeps beeping until the user moves on.
      if (st === step && st.timer.kind === "limit" && left < 0 && now - lastBeep > 8000) alarm(null, 2);
    });
    if (changed) save();

    // Current step's display.
    const tm = step.timer && g.timers[step.id];
    let timeTxt = "";
    if (step.timer) {
      const dur = step.timer.dur;
      const end = (tm ? tm.start : now) + dur;
      const left = end - (tm && tm.stopped ? tm.stopped : now);
      const over = left < 0;
      const d = fmtDur(Math.abs(left)), sign = over ? "+" : "";
      timeTxt = sign + d.txt;
      if (guideOpen && $("gTime")) {
        const box = $("gTimer");
        box.classList.toggle("over", over && step.timer.kind === "limit");
        box.classList.toggle("done", over && step.timer.kind === "target");
        if ($("gTime").innerHTML !== sign + d.html) $("gTime").innerHTML = sign + d.html;
        $("gTime").classList.toggle("long", d.html !== d.txt);
        $("gRing").style.strokeDashoffset = tm ? RING * Math.min(1, (dur - Math.max(0, left)) / dur) : 0;
        $("gSub").textContent = over ? t("guide.timeUp") : tm && dur >= HOUR ? t("guide.endsAt", { time: fmtClock(end) }) : "";
        const alertTxt = tm && tm.ended ? step.timer.up : tm && tm.reminded ? step.timer.remind.text : "";
        if ($("gAlert").textContent !== alertTxt) $("gAlert").textContent = alertTxt;
        $("gAlert").classList.toggle("over", over && step.timer.kind === "limit");
      }
    }
    const running = tm && !tm.stopped;
    document.title = running ? `${timeTxt} · Pizano` : "Pizano";

    // Floating shortcut back into the guide while it is closed.
    pill.hidden = guideOpen;
    if (!guideOpen) {
      const label = t("guide.stepOf", { i: g.step + 1, n: steps.length });
      pill.textContent = running ? t("guide.pill", { step: label, time: timeTxt }) : t("guide.resume");
      pill.classList.toggle("over", running && step.timer.kind === "limit" && tm.start + step.timer.dur < now);
    }
  }

  // ---- Sound, vibration, notifications ----
  function ensureAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }
  function beep(times) {
    if (!audio || state.guideSound === false) return;
    for (let i = 0; i < times; i++) {
      const osc = audio.createOscillator(), gain = audio.createGain();
      const at = audio.currentTime + i * 0.3;
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.35, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
      osc.connect(gain).connect(audio.destination);
      osc.start(at);
      osc.stop(at + 0.25);
    }
  }
  function alarm(text, beeps) {
    lastBeep = Date.now();
    beep(beeps);
    // Browsers only allow vibration after the user has tapped the page.
    const tapped = !navigator.userActivation || navigator.userActivation.hasBeenActive;
    try { if (navigator.vibrate && tapped) navigator.vibrate([200, 100, 200]); } catch (e) { /* unsupported */ }
    if (text && (document.hidden || !guideOpen) && "Notification" in window && Notification.permission === "granted") {
      try { new Notification("Pizano", { body: text, icon: $("favicon").href }); } catch (e) { /* unsupported */ }
    }
  }

  // Keeps the screen on while the guide is open, where the browser allows it.
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && "wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => { if (guideOpen && !document.hidden) keepAwake(true); });

  function openGuide() {
    ensureAudio();
    if (!state.guide) startGuide();
    enterStep();
    save();
    guideOpen = true;
    $("guide").hidden = false;
    document.body.classList.add("guide-open");
    keepAwake(true);
    renderGuide(true);
  }
  function closeGuide() {
    guideOpen = false;
    $("guide").hidden = true;
    $("guide").innerHTML = "";
    document.body.classList.remove("guide-open");
    keepAwake(false);
    updateGuideBtn();
    tickGuide();
  }
  // Throws the guide away completely: progress, timers and the floating pill.
  function endGuide() {
    if (!confirm(t("guide.endConfirm"))) return;
    state.guide = null;
    save();
    closeGuide();
  }
  function updateGuideBtn() {
    $("guideBtn").textContent = t(state.guide ? "guide.resume" : "guide.start");
    $("guideEnd").hidden = !state.guide;
  }

  $("guideBtn").addEventListener("click", openGuide);
  $("guidePill").addEventListener("click", openGuide);
  $("guideEnd").addEventListener("click", endGuide);
  document.addEventListener("keydown", (e) => { if (guideOpen && e.key === "Escape") closeGuide(); });

  // ---------- General procedure dialog ----------
  const howto = $("howto");
  document.addEventListener("click", (e) => {
    if (e.target.closest(".howto-open")) {
      e.preventDefault();
      howto.showModal();
      howto.scrollTop = 0;
    } else if (e.target.closest("[data-howto-close]") || e.target === howto) {
      // A click on the dialog element itself is a click on the backdrop.
      howto.close();
    }
  });
  document.addEventListener("pointerdown", ensureAudio);
  setInterval(tickGuide, 250);

  // ---------- Render ----------
  function render() {
    const d = computeDough();
    renderDough(d);
    renderSchedule();
    renderToppings();
    document.querySelectorAll('input[type="range"]').forEach(paintRange);
    updateGuideBtn();
    save();
  }

  // Sets how far the green fill runs, so it ends under the centre of the 18px thumb.
  function paintRange(el) {
    const p = (el.value - el.min) / (el.max - el.min);
    el.style.setProperty("--fill", `calc(${p * 100}% + ${(0.5 - p) * 18}px)`);
  }

  applyStatic();
  renderPizzaRows();
  showTab(state.tab || "dough");
  render();
})();
</script>
</body>
</html>
